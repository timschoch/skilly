# The PR gate. One job running one stage of .skilly/verify.json: Actions
# rounds every job up to the minute, so one 5-minute job beats five 1-minute ones.
#
# The stage is ci: everything, full unit suite and e2e smoke included. A product
# repo with a release PR and a nightly runs pr on its PRs instead: only the
# tests the diff reaches. The release PR runs ci, the nightly runs the full
# suites, so each merge to main still meets everything before it ships.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main] # rename if the default branch is not main

# A newer push to the same ref cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changed-files steps diff against the default branch
      - uses: actions/setup-node@v5
        with:
          node-version: lts/* # swap for node-version-file once the repo pins one
          cache: npm # keys off the lockfile
      - run: npm ci # lockfile only; a resolution drift fails here, not in prod
      # pr leaves the full suites to the release PR and the nightly, so it needs
      # both, and the nightly runs on the product tier only. Without that net,
      # and on the release PR itself, the stage is ci.
      - id: stage
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          stage=ci
          tier=$(node -p "require('./.skilly/config.json').tier" 2>/dev/null || true)
          if [ "$tier" = product ] && [ -f .github/workflows/nightly.yml ] \
            && grep -rqs release-please-action .github/workflows \
            && [[ "$HEAD_REF" != release-please--* ]]; then
            stage=pr
          fi
          echo "name=$stage" >> "$GITHUB_OUTPUT"
          # e2e smoke runs only in the ci stage of a product repo.
          e2e=false
          if [ "$stage" = ci ] && [ "$tier" = product ]; then e2e=true; fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
      # Browsers cost about a minute to install, so skip it where no e2e runs.
      - if: steps.stage.outputs.e2e == 'true' && hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium
      - run: node .agents/skills/verify/scripts/verify.mjs ${{ steps.stage.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ github.token }} # the audit step checks accepted advisories for a fix
