# Tool tier: advisories arrive as PRs, the verify gate checks them like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
  # engine/templates/ holds the action refs of every Consumer's Managed workflows.
  - package-ecosystem: github-actions
    directories: [/, /engine/templates]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
