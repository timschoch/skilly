# Keeps bundles/workflow/rules/invoke-cursor-skills.md in sync with the cursor/plugins
# skill list in the workflow bundle config. Regenerates on PRs that touch the
# config or the generator, and commits the result to the PR branch.
name: Update router rules

on:
  pull_request:
    paths:
      - bundles/workflow/config.json
      - bundles/workflow/scripts/update-router-rules.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Regenerate router rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bundles/workflow/scripts/update-router-rules.py

      - name: Commit if changed
        run: |
          if git diff --quiet bundles/workflow/rules/invoke-cursor-skills.md; then
            echo "router rules unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundles/workflow/rules/invoke-cursor-skills.md
          git commit -m "chore: regenerate router rules"
          git push
