# Shared skilly workflow. Consumers call it from the ~10-line caller that
# `skilly setup` scaffolds. Two jobs:
#   update — nightly/dispatch: resets the standing Sync PR branch from main,
#            runs `skilly update --headless`, refreshes the one Sync PR
#   gate   — pull_request: runs the gate Rules of the repo's bundles, then
#            merges a green Sync PR that contains no removals
name: skilly sync

on:
  workflow_call:
    inputs:
      private-owner:
        description: Owner of private skill sources (defaults to the consumer repo owner)
        type: string
        required: false
        default: ""

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # The skills CLI takes a single GH_TOKEN; scope a read token to the
      # private-source owner. gh/git keep the repo-scoped write token.
      - name: Mint read token (skills CLI)
        id: read-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SKILLY_APP_ID }}
          private-key: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
          owner: ${{ inputs.private-owner || github.repository_owner }}
          permission-contents: read

      # A PR opened with GITHUB_TOKEN triggers no workflows — the gate would
      # never run on the Sync PR. The write token makes the gate fire.
      - name: Mint write token (push + PR)
        id: write-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SKILLY_APP_ID }}
          private-key: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          token: ${{ steps.write-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          repository: timschoch/skilly
          ref: main
          path: .skilly-hub

      - name: Keep hub checkout out of the update commit
        run: echo "/.skilly-hub/" >> .git/info/exclude

      # One standing Sync PR: the branch is reset from main and rebuilt fresh
      # every night, so it always shows the current delta and never conflicts.
      - name: Reset the Sync PR branch from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/skilly-update "origin/${{ github.event.repository.default_branch }}"

      - name: Run update (headless)
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          SKILLY_SKILLS_TOKEN: ${{ steps.read-token.outputs.token }}
        run: node .skilly-hub/bin/skilly.js update --headless --report /tmp/skilly-report.json

      - name: Refresh the Sync PR body, or drop an empty one
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
        run: |
          default="origin/${{ github.event.repository.default_branch }}"
          if [ "$(git rev-list --count "$default"..HEAD)" = "0" ]; then
            gh pr close chore/skilly-update --delete-branch 2>/dev/null || true
            git push origin --delete chore/skilly-update 2>/dev/null || true
            echo "nothing changed — no Sync PR"
          else
            node .skilly-hub/scripts/render-pr-body.mjs /tmp/skilly-report.json > /tmp/skilly-pr-body.md
            gh pr edit chore/skilly-update --title "chore(skilly): update skills" --body-file /tmp/skilly-pr-body.md
          fi

  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # write: the merge step below; the caller must grant these too
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          repository: timschoch/skilly
          ref: main
          path: .skilly-hub

      - name: Run gate checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .skilly-hub/scripts/run-gate.mjs

      # Merge policy (design record, #17): the workflow merges a green Sync PR
      # with zero removals; a PR containing removals always waits for a human.
      # The removals marker is written by scripts/render-pr-body.mjs.
      - name: Merge a green, removal-free Sync PR
        if: github.event.pull_request.head.ref == 'chore/skilly-update'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" --json body --jq .body | grep -q 'skilly:removals'; then
            echo "Sync PR contains removals — waiting for a human"
          else
            gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch \
              || echo "not mergeable yet (other checks pending or red)"
          fi
