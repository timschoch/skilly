# Shared skilly workflow. Consumers call it from the ~10-line caller that
# `skilly setup` scaffolds. Two jobs:
#   update — nightly/dispatch: resets the standing Sync PR branch from main,
#            runs `skilly update --headless`, refreshes the one Sync PR
#   gate   — pull_request: runs the gate Rules of the repo's bundles, then
#            merges a green Sync PR that contains no removals
# Run in the Hub itself, it is the Hub nightly (ADR-0008 decision 6):
#   nightly — schedule/dispatch: the skilly App syncs every Consumer
#             (scripts/nightly.mjs). By hand: gh workflow run sync.yml
name: skilly sync (shared)

on:
  schedule: [{ cron: '0 2 * * *' }]
  workflow_dispatch:
    inputs:
      dry-run:
        description: List the Consumers and check their Engine, deliver nothing
        type: boolean
        default: false
      repo:
        description: Sync only this Consumer (owner/name)
        type: string
        default: ''
  workflow_call:
    inputs:
      private-owner:
        description: Owner of private skill sources (defaults to the consumer repo owner)
        type: string
        required: false
        default: ''
    # Callers name these; `secrets: inherit` passes nothing across owners.
    # Optional so an unhealed caller still runs the gate job.
    secrets:
      SKILLY_APP_ID:
        required: false
      SKILLY_APP_PRIVATE_KEY:
        required: false

jobs:
  # A called workflow sees the caller's workflow_ref, so this tells the Hub
  # nightly apart from a Consumer's call.
  nightly:
    if: >-
      startsWith(github.workflow_ref, 'timschoch/skilly/.github/workflows/sync.yml@') &&
      (github.event_name == 'workflow_dispatch' || vars.SKILLY_NIGHTLY == 'on')
    # The schedule waits for the repo variable SKILLY_NIGHTLY=on: until #220,
    # Consumers still run the update job below and would get two Sync PRs.
    concurrency:
      group: skilly-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync every Consumer
        env:
          SKILLY_APP_ID: ${{ secrets.SKILLY_APP_ID }}
          SKILLY_APP_PRIVATE_KEY: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
          REPO: ${{ inputs.repo }}
        run: |
          git config --global user.name 'skilly-sync[bot]'
          git config --global user.email '323094747+skilly-sync[bot]@users.noreply.github.com'
          # The skills CLI targets every agent when it detects none; ~/.claude pins it to Claude Code.
          mkdir -p ~/.claude
          node scripts/nightly.mjs ${DRY_RUN:+--dry-run} ${REPO:+--repo "$REPO"}

  update:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.workflow_ref, 'timschoch/skilly/.github/workflows/sync.yml@')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # The skills CLI takes a single GH_TOKEN; scope a read token to the
      # private-source owner. gh/git keep the repo-scoped write token.
      - name: Check App secrets
        env:
          APP_ID: ${{ secrets.SKILLY_APP_ID }}
          APP_KEY: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::SKILLY_APP_ID / SKILLY_APP_PRIVATE_KEY did not arrive. Name them under 'secrets:' in .github/workflows/skilly-sync.yml ('secrets: inherit' passes nothing across owners), or run 'skilly setup' to set them."
            exit 1
          fi

      - name: Mint read token (skills CLI)
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SKILLY_APP_ID }}
          private-key: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
          owner: ${{ inputs.private-owner || github.repository_owner }}
          permission-contents: read

      # A PR opened with GITHUB_TOKEN triggers no workflows — the gate would
      # never run on the Sync PR. The write token makes the gate fire.
      - name: Mint write token (push + PR)
        id: write-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SKILLY_APP_ID }}
          private-key: ${{ secrets.SKILLY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          token: ${{ steps.write-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout hub
        uses: actions/checkout@v7
        with:
          repository: timschoch/skilly
          ref: main
          path: .skilly-hub

      - name: Keep hub checkout out of the update commit
        run: echo "/.skilly-hub/" >> .git/info/exclude

      # One standing Sync PR: the branch is reset from main and rebuilt fresh
      # every night, so it always shows the current delta and never conflicts.
      - name: Reset the Sync PR branch from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/skilly-update "origin/${{ github.event.repository.default_branch }}"

      - name: Run update (headless)
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          SKILLY_SKILLS_TOKEN: ${{ steps.read-token.outputs.token }}
        run: |
          # The skills CLI targets "all agents" when it detects none installed
          # (-y, fresh runner) — that once wrote an agent/ dir (Eve) into a
          # consumer. ~/.claude is its Claude Code marker: pin detection to it.
          mkdir -p ~/.claude
          node .skilly-hub/bin/skilly.js update --headless --report /tmp/skilly-report.json

      - name: Refresh the Sync PR body, or drop an empty one
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
        run: |
          default="origin/${{ github.event.repository.default_branch }}"
          if [ "$(git rev-list --count "$default"..HEAD)" = "0" ]; then
            gh pr close chore/skilly-update --delete-branch 2>/dev/null || true
            git push origin --delete chore/skilly-update 2>/dev/null || true
            echo "nothing changed — no Sync PR"
          else
            node .skilly-hub/scripts/render-pr-body.mjs /tmp/skilly-report.json > /tmp/skilly-pr-body.md
            gh pr edit chore/skilly-update --title "chore(skilly): update skills" --body-file /tmp/skilly-pr-body.md
          fi

  gate:
    if: github.event_name == 'pull_request'
    # A newer push to the same PR cancels the gate run it superseded.
    concurrency:
      group: skilly-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # write: the merge step below; the caller must grant these too
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout hub
        uses: actions/checkout@v7
        with:
          repository: timschoch/skilly
          ref: main
          path: .skilly-hub

      - name: Run gate checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .skilly-hub/scripts/run-gate.mjs

      # Merge policy (design record, #17): the workflow merges a green Sync PR
      # with zero removals; a PR containing removals always waits for a human.
      # --auto: with required checks still running, GitHub merges once they
      # pass (needs allow_auto_merge); with none, gh merges at once.
      # Removals are read from the branch's commit subjects (skillyMessage
      # writes "chore(skilly): remove …") — intrinsic to the push, so the
      # decision cannot race a later body edit.
      - name: Merge a green, removal-free Sync PR
        if: github.event.pull_request.head.ref == 'chore/skilly-update'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" --json commits --jq '.commits[].messageHeadline' | grep -q '^chore(skilly): remove'; then
            echo "Sync PR contains removals — waiting for a human"
          else
            gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --delete-branch \
              || echo "not merged: turn on allow_auto_merge, or a required check is red"
          fi
