# Hub CI: unit tests + bundle validation. Auth regression lives in
# validate-app-auth.yml (workflow_dispatch).
name: CI

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm test
      - run: node scripts/validate-bundles.mjs
