# The PR gate: one job running the ci stage of .skilly/verify.json. Actions
# rounds every job up to the minute, so one job beats several short ones.
# Auth regression lives in validate-app-auth.yml (workflow_dispatch).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same ref cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The hub is its own Source, so the verify skill is called where it lives.
      - run: node bundles/workflow/skills/verify/scripts/verify.mjs ci
